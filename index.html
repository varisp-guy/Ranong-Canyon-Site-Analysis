<script>
(function(){
const DATA = JSON.parse(document.getElementById('sitedata').textContent);
const cx = (DATA.siteMin[0]+DATA.siteMax[0])/2, cy = (DATA.siteMin[1]+DATA.siteMax[1])/2;
const cz = (DATA.siteZ[0]+DATA.siteZ[1])/2;
// world = (x-cx, z_up-cz, -(y-cy))  [Rhino Z-up -> three Y-up, flip Y->-Z]
function W(x,y,z){ return [x-cx, z-cz, -(y-cy)]; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0022);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.5, 8000);
camera.position.set(0, 260, 340);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x999999, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 0.5);
key.position.set(200,400,150); scene.add(key);

// ---------- Layer groups (for explode). order 0 = bottom composite, 1..6 = individual, stacked above ----------
const layers = {}; // name -> {group, order, label}
const gComposite = new THREE.Group(); scene.add(gComposite);
layers['composite'] = {group:gComposite, order:0, label:'SITE COMPOSITE — ALL LAYERS'};
function makeLayer(name, label, order){
  const g = new THREE.Group();
  scene.add(g);
  layers[name] = {group:g, order, label};
  return g;
}
const gTopo = makeLayer('topo','TOPOGRAPHY MESH',1);
const gWater = makeLayer('water','WATER SURFACE',2);
const gContour = makeLayer('contour','5M CONTOUR',3);
const gRoad = makeLayer('road','ROAD',4);
const gTrees = makeLayer('trees','FICUS RELIGIOSA — TREE LOCATION',5);
const gGrid = makeLayer('grid','AMPHIBIOUS GRID ANALYSIS',6);
// helper: add a mesh-like object to both its own layer group AND the composite group,
// sharing geometry/material (cheap - no vertex duplication)
function dualAdd(target, factory){
  target.add(factory());
  gComposite.add(factory());
}

// ---------- Topography mesh: translucent + point texture ----------
(function(){
  const v = DATA.topo.v, f = DATA.topo.f;
  const pos = new Float32Array(v.length);
  for(let i=0;i<v.length;i+=3){ const w=W(v[i],v[i+1],v[i+2]); pos[i]=w[0];pos[i+1]=w[1];pos[i+2]=w[2]; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setIndex(f);
  geo.computeVertexNormals();
  const wfGeo = new THREE.WireframeGeometry(geo);
  const mat = new THREE.MeshStandardMaterial({color:0xaaaaaa, transparent:true, opacity:0.22, roughness:1, metalness:0, side:THREE.DoubleSide, depthWrite:false});
  const pmat = new THREE.PointsMaterial({color:0xffffff, size:1.6, transparent:true, opacity:0.5, sizeAttenuation:true});
  const wfmat = new THREE.LineBasicMaterial({color:0xd8d8d8, transparent:true, opacity:0.45});
  dualAdd(gTopo, ()=> new THREE.Mesh(geo, mat));
  dualAdd(gTopo, ()=> new THREE.Points(geo, pmat));
  dualAdd(gTopo, ()=> new THREE.LineSegments(wfGeo, wfmat));
})();

// ---------- Water ----------
(function(){
  const v = DATA.water.v, f = DATA.water.f;
  const pos = new Float32Array(v.length);
  for(let i=0;i<v.length;i+=3){ const w=W(v[i],v[i+1],v[i+2]); pos[i]=w[0];pos[i+1]=w[1]+0.4;pos[i+2]=w[2]; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setIndex(f);
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({color:0xd8d8d8, transparent:true, opacity:0.5, roughness:0.1, metalness:0.05, side:THREE.DoubleSide, depthWrite:false});
  dualAdd(gWater, ()=> new THREE.Mesh(geo, mat));
})();

// ---------- Contours & roads (line polylines) ----------
function addLines(group, lines, color, opacity, yOff){
  const pts = [];
  for(const line of lines){
    for(let i=0;i<line.length-1;i++){
      const a=W(...line[i]), b=W(...line[i+1]);
      pts.push(a[0],a[1]+yOff,a[2], b[0],b[1]+yOff,b[2]);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  const mat = new THREE.LineBasicMaterial({color, transparent:true, opacity});
  dualAdd(group, ()=> new THREE.LineSegments(geo, mat));
}
addLines(gContour, DATA.contours, 0x999999, 0.35, 0.15);
addLines(gRoad, DATA.roads, 0xffffff, 0.8, 0.25);

// ---------- Ficus religiosa silhouette (procedural, instanced, black fill + white outline) ----------
function buildFicusGeometry(){
  const parts = [];
  function push(geo, mat4){ geo.applyMatrix4(mat4); parts.push(geo); }
  const trunk = new THREE.CylinderGeometry(0.35,0.55,4.2,6);
  push(trunk, new THREE.Matrix4().makeTranslation(0,2.1,0));
  const lobes = [
    [0,6.2,0, 4.6,4.0,4.6, 0],
    [1.8,7.6,1.2, 3.4,3.0,3.4, 0.4],
    [-1.6,7.2,-1.0, 3.2,2.8,3.2, -0.3],
    [0.4,9.0,-1.6, 2.6,2.3,2.6, 0.2],
    [-1.2,8.6,1.6, 2.4,2.2,2.4, -0.5],
  ];
  for(const [x,y,z,sx,sy,sz,rz] of lobes){
    const s = new THREE.IcosahedronGeometry(1,1);
    const m = new THREE.Matrix4().compose(
      new THREE.Vector3(x,y,z),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,rz)),
      new THREE.Vector3(sx,sy,sz));
    push(s, m);
  }
  return mergeGeoms(parts);
}
function mergeGeoms(geos){
  let totalV=0, totalI=0;
  for(const g of geos){ totalV += g.attributes.position.count; totalI += (g.index?g.index.count:g.attributes.position.count); }
  const pos = new Float32Array(totalV*3);
  const idx = new Uint32Array(totalI);
  let vOff=0, iOff=0, vBase=0;
  for(const g of geos){
    const p = g.attributes.position;
    pos.set(p.array, vOff); vOff += p.array.length;
    if(g.index){
      for(let k=0;k<g.index.count;k++) idx[iOff+k] = g.index.array[k] + vBase;
      iOff += g.index.count;
    } else {
      for(let k=0;k<p.count;k++) idx[iOff+k] = k + vBase;
      iOff += p.count;
    }
    vBase += p.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  out.computeVertexNormals();
  return out;
}
(function(){
  const baseGeo = buildFicusGeometry();
  const n = DATA.trees.length;
  const blackMat = new THREE.MeshBasicMaterial({color:0x000000});
  const outlineMat = new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.BackSide});
  const inst = new THREE.InstancedMesh(baseGeo, blackMat, n);
  const instOutline = new THREE.InstancedMesh(baseGeo, outlineMat, n);
  const dummy = new THREE.Object3D();
  for(let i=0;i<n;i++){
    const t = DATA.trees[i];
    const w = W(t[0],t[1],t[2]);
    const s = 0.75 + Math.random()*0.5;
    const rot = Math.random()*Math.PI*2;
    dummy.position.set(w[0], w[1], w[2]);
    dummy.rotation.set(0, rot, 0);
    dummy.scale.set(s,s,s);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
    dummy.scale.set(s*1.07, s*1.07, s*1.07);
    dummy.updateMatrix();
    instOutline.setMatrixAt(i, dummy.matrix);
  }
  gTrees.add(instOutline);
  gTrees.add(inst);
  const inst2 = new THREE.InstancedMesh(baseGeo, blackMat, n);
  inst2.instanceMatrix.array.set(inst.instanceMatrix.array);
  inst2.instanceMatrix.needsUpdate = true;
  const instOutline2 = new THREE.InstancedMesh(baseGeo, outlineMat, n);
  instOutline2.instanceMatrix.array.set(instOutline.instanceMatrix.array);
  instOutline2.instanceMatrix.needsUpdate = true;
  gComposite.add(instOutline2);
  gComposite.add(inst2);
})();

// ---------- Amphibious grid (10x10m, land/water %, 5 greyscale levels) ----------
// level 0 = wettest (near-black) -> level 4 = driest/land (near-white)
const LEVEL_GREYS = [0x141414, 0x4a4a4a, 0x7f7f7f, 0xb5b5b5, 0xeaeaea];
function levelFor(waterPct){
  if(waterPct>=80) return 0;
  if(waterPct>=60) return 1;
  if(waterPct>=40) return 2;
  if(waterPct>=20) return 3;
  return 4;
}
(function(){
  const cell = DATA.grid.cell;
  const grays = LEVEL_GREYS.map(c=> new THREE.Color(c));
  const planePos = [], planeColor = [], planeIdx = [];
  const edgePos = [];
  const labelSpecs = [];
  let vi = 0;
  for(const c of DATA.grid.cells){
    const lvl = levelFor(c.w);
    const col = grays[lvl];
    const corners = [[c.x,c.y],[c.x+cell,c.y],[c.x+cell,c.y+cell],[c.x,c.y+cell]];
    for(const [px,py] of corners){
      const w = W(px,py,cz);
      planePos.push(w[0], 3.0, w[2]);
      planeColor.push(col.r,col.g,col.b);
    }
    planeIdx.push(vi,vi+1,vi+2, vi,vi+2,vi+3);
    for(let k=0;k<4;k++){
      const a=W(corners[k][0],corners[k][1],cz), b=W(corners[(k+1)%4][0],corners[(k+1)%4][1],cz);
      edgePos.push(a[0],3.02,a[2], b[0],3.02,b[2]);
    }
    vi += 4;
    const w = W(c.x+cell/2, c.y+cell/2, cz);
    const area = cell*cell;
    const wPct = Math.round(c.w), lPct = 100-wPct;
    const wSqm = Math.round(area*c.w/100), lSqm = area-wSqm;
    labelSpecs.push({pos:[w[0],4.2,w[2]], l1: lPct+'% land / '+wPct+'% water', l2: lSqm+'m\u00b2 / '+wSqm+'m\u00b2', key: lPct+'-'+wPct});
  }
  const pgeo = new THREE.BufferGeometry();
  pgeo.setAttribute('position', new THREE.Float32BufferAttribute(planePos,3));
  pgeo.setAttribute('color', new THREE.Float32BufferAttribute(planeColor,3));
  pgeo.setIndex(planeIdx);
  const pmat = new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false});
  dualAdd(gGrid, ()=> new THREE.Mesh(pgeo, pmat));

  const egeo = new THREE.BufferGeometry();
  egeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePos,3));
  const emat = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.22});
  dualAdd(gGrid, ()=> new THREE.LineSegments(egeo, emat));

  const texCache = {};
  function getTex(l1, l2, key){
    if(texCache[key]) return texCache[key];
    const c = document.createElement('canvas'); c.width=220; c.height=72;
    const ctx = c.getContext('2d');
    ctx.font='bold 18px monospace'; ctx.fillStyle='#ffffff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(l1, 110, 26);
    ctx.font='16px monospace'; ctx.fillStyle='#cfcfcf';
    ctx.fillText(l2, 110, 50);
    const tex = new THREE.CanvasTexture(c);
    texCache[key] = tex;
    return tex;
  }
  for(const ls of labelSpecs){
    const tex = getTex(ls.l1, ls.l2, ls.key);
    dualAdd(gGrid, ()=>{
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
      spr.scale.set(9.5,3.1,1);
      spr.position.set(ls.pos[0], ls.pos[1], ls.pos[2]);
      return spr;
    });
  }
})();

// ---------- Layer floating labels (for explode mode) ----------
const layerLabels = {};
for(const key in layers){
  const spr = makeLabelSprite2(layers[key].label);
  spr.visible = false;
  scene.add(spr);
  layerLabels[key] = spr;
}
function makeLabelSprite2(text){
  const c = document.createElement('canvas'); c.width=512; c.height=64;
  const ctx = c.getContext('2d');
  ctx.font='bold 26px monospace'; ctx.fillStyle='#ffffff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, 256, 32);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  spr.scale.set(60,7.5,1);
  return spr;
}

// ---------- Explode state ----------
let explodeT = 0, explodeTarget = 0;
const EXPLODE_GAP = 55;
function updateExplode(){
  for(const key in layers){
    const L = layers[key];
    const y = explodeT * L.order * EXPLODE_GAP;
    L.group.position.y = y;
    layerLabels[key].position.set(0, y + 20, 0);
    layerLabels[key].visible = explodeT > 0.05;
  }
}
updateExplode();

// ---------- Fly camera (WASD + mouse look via pointer lock) ----------
let locked=false, yaw=0, pitch=-0.15;
const keys = {};
renderer.domElement.addEventListener('click', ()=>{ if(!locked) renderer.domElement.requestPointerLock(); });
document.addEventListener('pointerlockchange', ()=>{ locked = document.pointerLockElement===renderer.domElement; });
document.addEventListener('mousemove', e=>{
  if(!locked) return;
  yaw -= e.movementX*0.0022;
  pitch -= e.movementY*0.0022;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
});
document.addEventListener('keydown', e=> keys[e.code]=true);
document.addEventListener('keyup', e=> keys[e.code]=false);
let speed = 90;
document.addEventListener('wheel', e=>{ speed = Math.max(8, Math.min(500, speed - e.deltaY*0.08)); });

function updateCamera(dt){
  camera.rotation.order='YXZ';
  camera.rotation.y = yaw; camera.rotation.x = pitch;
  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  const right = new THREE.Vector3(1,0,0).applyEuler(camera.rotation);
  let v = new THREE.Vector3();
  if(keys['KeyW']) v.add(dir);
  if(keys['KeyS']) v.sub(dir);
  if(keys['KeyD']) v.add(right);
  if(keys['KeyA']) v.sub(right);
  if(keys['Space']) v.y += 1;
  if(keys['ShiftLeft']) v.y -= 1;
  if(v.lengthSq()>0){ v.normalize().multiplyScalar(speed*dt); camera.position.add(v); }
}

// ---------- UI ----------
document.getElementById('explodeToggle').addEventListener('click', e=>{
  explodeTarget = explodeTarget>0 ? 0 : 1;
  e.target.classList.toggle('active', explodeTarget>0);
  e.target.textContent = explodeTarget>0 ? '[ COLLAPSE LAYERS ]' : '[ EXPLODE LAYERS ]';
});
document.getElementById('speedLabel').textContent = 'speed '+Math.round(speed);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  updateCamera(dt);
  explodeT += (explodeTarget-explodeT)*Math.min(1, dt*3);
  updateExplode();
  document.getElementById('speedLabel').textContent = 'speed '+Math.round(speed)+' m/s';
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
})();

</script>
